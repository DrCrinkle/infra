---
- name: Update all system packages
  ansible.builtin.dnf:
    name: '*'
    state: latest
    update_cache: yes
  become: true
  register: system_update

- name: Reboot after system update
  ansible.builtin.reboot:
    reboot_timeout: 300
  become: true
  when: system_update.changed

- name: Install base packages
  ansible.builtin.dnf:
    name:
      - git
      - curl
      - wget
      - jq
      - lsof
      - python3
      - chrony
      - nc
    state: present
  become: true

- name: Start and enable chrony for NTP
  ansible.builtin.systemd:
    name: chronyd
    state: started
    enabled: yes
  become: true

- name: Enable lingering for user services
  ansible.builtin.command:
    cmd: loginctl enable-linger {{ ansible_user }}
  become: true
  changed_when: false
