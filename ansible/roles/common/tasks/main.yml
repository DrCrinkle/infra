---
- name: Update all system packages
  ansible.builtin.dnf:
    name: '*'
    state: latest
    update_cache: yes
  become: true
  register: system_update

- name: Reboot after system update
  ansible.builtin.reboot:
    reboot_timeout: 300
  become: true
  when: system_update.changed

- name: Install base packages
  ansible.builtin.dnf:
    name:
      - git
      - curl
      - wget
      - jq
      - lsof
      - python3
      - chrony
      - nc
    state: present
  become: true

- name: Start and enable chrony for NTP
  ansible.builtin.systemd:
    name: chronyd
    state: started
    enabled: yes
  become: true

- name: Enable lingering for user services
  ansible.builtin.command:
    cmd: loginctl enable-linger {{ ansible_user }}
  become: true
  changed_when: false

# Host hardening
# (NAT64/DNS64 routing removed 2026-05-30: OpenClaw moved to the public subnet with
#  native dual-stack via the Internet Gateway; the dedicated NAT instance is gone.)
- name: Disable rpcbind (no NFS in use — removes the port-111 attack surface)
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: no
  loop:
    - rpcbind.socket
    - rpcbind.service
  become: true
  failed_when: false

- name: Harden SSH — disable root login (access is via the unprivileged user + sudo)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      # Managed by Ansible (common role). Root SSH is disabled — use {{ ansible_user }} + sudo.
      PermitRootLogin no
    owner: root
    group: root
    mode: "0600"
  become: true
  notify: Reload sshd
