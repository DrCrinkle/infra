---
- name: Update all system packages
  ansible.builtin.dnf:
    name: '*'
    state: latest
    update_cache: yes
  become: true
  register: system_update

- name: Reboot after system update
  ansible.builtin.reboot:
    reboot_timeout: 300
  become: true
  when: system_update.changed

- name: Install base packages
  ansible.builtin.dnf:
    name:
      - git
      - curl
      - wget
      - jq
      - lsof
      - python3
      - chrony
      - nc
    state: present
  become: true

- name: Start and enable chrony for NTP
  ansible.builtin.systemd:
    name: chronyd
    state: started
    enabled: yes
  become: true

- name: Enable lingering for user services
  ansible.builtin.command:
    cmd: loginctl enable-linger {{ ansible_user }}
  become: true
  changed_when: false

# Host hardening
# (NAT64/DNS64 routing removed 2026-05-30: OpenClaw moved to the public subnet with
#  native dual-stack via the Internet Gateway; the dedicated NAT instance is gone.)
- name: Disable rpcbind (no NFS in use — removes the port-111 attack surface)
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: no
  loop:
    - rpcbind.socket
    - rpcbind.service
  become: true
  failed_when: false

# sshd keeps the FIRST value it reads, so this must sort before the distro's
# 50-redhat.conf (which sets X11Forwarding yes). TCP forwarding stays on: the
# Hermes desktop-remote backend is reached over an SSH tunnel.
- name: Harden SSH — no root login, no X11, fewer auth attempts
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      # Managed by Ansible (common role). Root SSH is disabled — use {{ ansible_user }} + sudo.
      PermitRootLogin no
      X11Forwarding no
      MaxAuthTries 3
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  become: true
  notify: Reload sshd

- name: Remove the old late-sorting hardening drop-in
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/99-hardening.conf
    state: absent
  become: true
  notify: Reload sshd

# Unattended security patching (sentinel/edge-lab sat on 145 advisories for
# 5+ weeks before this existed). Matches what OpenClaw already ran by hand.
- name: Install dnf-automatic
  ansible.builtin.dnf:
    name: dnf-automatic
    state: present
  become: true

- name: Configure dnf-automatic to apply updates and reboot when needed
  ansible.builtin.lineinfile:
    path: /etc/dnf/automatic.conf
    regexp: "^{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
  loop:
    - { key: apply_updates, value: "yes" }
    - { key: reboot, value: when-needed }
    - { key: reboot_command, value: "\"shutdown -r +5 'Rebooting after applying package updates'\"" }
  become: true

- name: Enable dnf-automatic timer
  ansible.builtin.systemd:
    name: dnf-automatic.timer
    state: started
    enabled: yes
  become: true
