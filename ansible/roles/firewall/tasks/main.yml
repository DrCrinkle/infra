---
- name: Install firewalld
  ansible.builtin.dnf:
    name: firewalld
    state: present
  become: true

- name: Start and enable firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: yes
  become: true

- name: Set default zone to drop
  ansible.builtin.command:
    cmd: firewall-cmd --set-default-zone=drop
  become: true
  changed_when: false

# SSH on eth0 is VCN-only (bastion sessions arrive from 10.0.0.0/16); the
# tailnet path goes through the trusted zone and is unaffected.
- name: Allow SSH from the VCN only
  ansible.posix.firewalld:
    rich_rule: rule family="ipv4" source address="10.0.0.0/16" service name="ssh" accept
    permanent: yes
    immediate: yes
    state: enabled
    zone: drop
  become: true

- name: Drop the open SSH service from the drop zone
  ansible.posix.firewalld:
    service: ssh
    permanent: yes
    immediate: yes
    state: disabled
    zone: drop
  become: true

# DHCPv6 replies arrive over plain UDP (unlike DHCPv4's packet sockets), so the
# drop zone discards them and the OCI-assigned IPv6 lease expires ~25h after boot.
- name: Allow DHCPv6 client (link-local replies only)
  ansible.posix.firewalld:
    service: dhcpv6-client
    permanent: yes
    immediate: yes
    state: enabled
    zone: drop
  become: true

- name: Allow Tailscale UDP port
  ansible.posix.firewalld:
    port: 41641/udp
    permanent: yes
    immediate: yes
    state: enabled
    zone: public
  become: true

- name: Trust Tailscale interface
  ansible.posix.firewalld:
    zone: trusted
    interface: tailscale0
    permanent: yes
    immediate: yes
    state: enabled
  become: true
  failed_when: false

- name: Remove default services we don't need
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: yes
    immediate: yes
    state: disabled
    zone: public
  loop:
    - cockpit
    - dhcpv6-client
  become: true
  failed_when: false

- name: Create Docker isolation direct rules
  ansible.builtin.shell: |
    firewall-cmd --permanent --direct --add-chain ipv4 filter DOCKER-USER 2>/dev/null || true
    firewall-cmd --permanent --direct --add-rule ipv4 filter DOCKER-USER 0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || true
    firewall-cmd --permanent --direct --add-rule ipv4 filter DOCKER-USER 0 -i lo -j ACCEPT 2>/dev/null || true
    firewall-cmd --permanent --direct --add-rule ipv4 filter DOCKER-USER 10 -i eth0 -j DROP 2>/dev/null || true
    firewall-cmd --reload 2>/dev/null || true
  become: true
  when: docker_enabled | default(true)
  changed_when: false
  failed_when: false

# OpenClaw is the NAT router for the private subnet (replaced the dedicated NAT
# instance 2026-05-30). Requires VNIC skip_source_dest_check = true (set in Terraform).
- name: Enable IPv4 forwarding for NAT routing
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_file: /etc/sysctl.d/99-openclaw-nat.conf
    sysctl_set: yes
    state: present
    reload: yes
  become: true
  when: openclaw_nat_router | default(true)

- name: Allow intra-zone forwarding on the public-facing drop zone
  ansible.posix.firewalld:
    zone: drop
    forward: yes
    permanent: yes
    immediate: yes
    state: enabled
  become: true
  when: openclaw_nat_router | default(true)

- name: Masquerade private-subnet egress through this host
  ansible.posix.firewalld:
    zone: drop
    rich_rule: 'rule family="ipv4" source address="{{ private_subnet_cidr }}" masquerade'
    permanent: yes
    immediate: yes
    state: enabled
  become: true
  when: openclaw_nat_router | default(true)
