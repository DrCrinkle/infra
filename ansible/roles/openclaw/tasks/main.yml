---
- name: Install openclaw via npm
  ansible.builtin.shell: |
    export PATH="$HOME/.npm-global/bin:$PATH"
    npm install -g openclaw@{{ openclaw_version }}
  when: openclaw_install_method == "npm"
  register: npm_install
  changed_when: "'added' in npm_install.stdout or 'updated' in npm_install.stdout"

- name: Clone openclaw from git
  ansible.builtin.git:
    repo: https://github.com/openclaw/openclaw.git
    dest: "{{ openclaw_git_dir }}"
    version: main
  when: openclaw_install_method == "git"

- name: Install pnpm for git install
  ansible.builtin.shell: |
    export PATH="$HOME/.npm-global/bin:$PATH"
    npm install -g pnpm
  when: openclaw_install_method == "git"

- name: Build openclaw from source
  ansible.builtin.shell: |
    export PATH="$HOME/.npm-global/bin:$PATH"
    cd {{ openclaw_git_dir }}
    pnpm install
    pnpm build
  when: openclaw_install_method == "git"

- name: Symlink openclaw to PATH
  ansible.builtin.file:
    src: "{{ openclaw_git_dir }}/openclaw.mjs"
    dest: /usr/local/bin/openclaw
    state: link
  become: true
  when: openclaw_install_method == "git"

# Only create dirs Ansible legitimately owns: the state dir (for the seeded
# config) and the systemd user dir. Agent workspaces are created by OpenClaw at
# runtime under ~/.openclaw/workspaces/* — don't pre-create vestigial dirs at
# stale paths the gateway never uses.
- name: Create openclaw directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0700'
  loop:
    - "{{ openclaw_state_dir }}"
    - ~/.config/systemd/user

# OpenClaw owns openclaw.json at runtime — the wizard, UI, and workflow tooling
# rewrite it constantly (agents, model rosters, channels, tool policies, plugins,
# skills, cron, sessions). So we SEED it only when absent (fresh host bootstrap)
# and never overwrite an existing file. Ongoing security invariants are enforced
# by the deep-merge task below, not by re-templating the whole file.
- name: Seed openclaw config (only if absent — never clobbers OpenClaw-managed state)
  ansible.builtin.template:
    src: openclaw.json.j2
    dest: "{{ openclaw_state_dir }}/openclaw.json"
    mode: '0600'
    force: false
  notify: restart openclaw

# exec-approvals.json accumulates runtime-approved commands — seed only, same reason.
- name: Seed exec-approvals config (only if absent)
  ansible.builtin.template:
    src: exec-approvals.json.j2
    dest: "{{ openclaw_state_dir }}/exec-approvals.json"
    mode: '0600'
    force: false
  notify: restart openclaw

# Enforce ONLY the security-invariant keys Ansible owns (gateway bind/auth/proxies,
# exec security mode) by deep-merging them into the live config, preserving every
# OpenClaw-managed section. jq `*` recursively merges objects (managed side wins) and
# leaves untouched keys intact. Idempotent: normalized compare gates changed/restart.
- name: Render Ansible-owned security invariants
  ansible.builtin.set_fact:
    openclaw_invariants: "{{ lookup('template', 'openclaw.invariants.json.j2') }}"
  no_log: true

- name: Enforce openclaw security invariants (deep-merge, non-destructive)
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      cd {{ openclaw_state_dir | quote }}
      printf '%s' {{ openclaw_invariants | quote }} > .invariants.json
      jq -e . .invariants.json >/dev/null
      jq --slurpfile inv .invariants.json '. * $inv[0]' openclaw.json > .merged.json
      if diff -q <(jq -S . openclaw.json) <(jq -S . .merged.json) >/dev/null; then
        rm -f .invariants.json .merged.json
        echo NOCHANGE
      else
      {% if not ansible_check_mode %}
        mv .merged.json openclaw.json
        chmod 600 openclaw.json
      {% else %}
        rm -f .merged.json
      {% endif %}
        rm -f .invariants.json
        echo CHANGED
      fi
  register: openclaw_invariants_merge
  changed_when: "'CHANGED' in openclaw_invariants_merge.stdout"
  check_mode: false
  no_log: true
  notify: restart openclaw

# OpenClaw owns its own systemd user unit: `openclaw gateway install` generates it
# and the gateway rewrites it on every self-update (version stamp, EnvironmentFile,
# StartLimit*). We do NOT template it — Ansible would only create drift that the next
# update clobbers. The `creates:` guard makes this idempotent and a no-op once the
# unit exists. NOTE: requires a working OpenClaw CLI (see global-agent prerequisite).
- name: Install gateway systemd unit (openclaw-owned)
  ansible.builtin.command:
    cmd: "{{ openclaw_git_dir }}/openclaw.mjs gateway install"
    creates: ~/.config/systemd/user/openclaw-gateway.service
  environment:
    PATH: "{{ ansible_env.HOME }}/.npm-global/bin:{{ ansible_env.PATH }}"

- name: Enable and start openclaw gateway
  ansible.builtin.systemd:
    name: openclaw-gateway
    state: started
    enabled: yes
    scope: user
    daemon_reload: yes

# Weekly maintenance: the pnpm store accumulates every version of every package
# across all projects and never GCs on its own — prune it so the boot volume
# doesn't silently fill (git install only; npm install doesn't use the pnpm store).
- name: Deploy pnpm store prune service
  ansible.builtin.template:
    src: pnpm-store-prune.service.j2
    dest: ~/.config/systemd/user/pnpm-store-prune.service
    mode: '0644'
  when: openclaw_install_method == "git"

- name: Deploy pnpm store prune timer
  ansible.builtin.template:
    src: pnpm-store-prune.timer.j2
    dest: ~/.config/systemd/user/pnpm-store-prune.timer
    mode: '0644'
  when: openclaw_install_method == "git"

- name: Enable and start pnpm store prune timer
  ansible.builtin.systemd:
    name: pnpm-store-prune.timer
    state: started
    enabled: yes
    scope: user
    daemon_reload: yes
  when: openclaw_install_method == "git"
