---
- name: Install openclaw via npm
  ansible.builtin.shell: |
    export PATH="$HOME/.npm-global/bin:$PATH"
    npm install -g openclaw@{{ openclaw_version }}
  when: openclaw_install_method == "npm"
  register: npm_install
  changed_when: "'added' in npm_install.stdout or 'updated' in npm_install.stdout"

- name: Clone openclaw from git
  ansible.builtin.git:
    repo: https://github.com/openclaw/openclaw.git
    dest: "{{ openclaw_git_dir }}"
    version: main
  when: openclaw_install_method == "git"

- name: Install pnpm for git install
  ansible.builtin.shell: |
    export PATH="$HOME/.npm-global/bin:$PATH"
    npm install -g pnpm
  when: openclaw_install_method == "git"

- name: Build openclaw from source
  ansible.builtin.shell: |
    export PATH="$HOME/.npm-global/bin:$PATH"
    cd {{ openclaw_git_dir }}
    pnpm install
    pnpm build
  when: openclaw_install_method == "git"

- name: Symlink openclaw to PATH
  ansible.builtin.file:
    src: "{{ openclaw_git_dir }}/openclaw.mjs"
    dest: /usr/local/bin/openclaw
    state: link
  become: true
  when: openclaw_install_method == "git"

- name: Configure OpenClaw recovery files
  ansible.builtin.import_tasks: recovery.yml
  tags: ['openclaw_recovery']

- name: Create the systemd user directory
  ansible.builtin.file:
    path: ~/.config/systemd/user
    state: directory
    mode: '0700'

# OpenClaw owns its own systemd user unit: `openclaw gateway install` generates it
# and the gateway rewrites it on every self-update (version stamp, EnvironmentFile,
# StartLimit*). We do NOT template it — Ansible would only create drift that the next
# update clobbers. The `creates:` guard makes this idempotent and a no-op once the
# unit exists. NOTE: requires a working OpenClaw CLI (see global-agent prerequisite).
- name: Install gateway systemd unit (openclaw-owned)
  ansible.builtin.command:
    cmd: "{{ openclaw_git_dir }}/openclaw.mjs gateway install"
    creates: ~/.config/systemd/user/openclaw-gateway.service
  environment:
    PATH: "{{ ansible_env.HOME }}/.npm-global/bin:{{ ansible_env.PATH }}"

- name: Enable and start openclaw gateway
  ansible.builtin.systemd:
    name: openclaw-gateway
    state: started
    enabled: yes
    scope: user
    daemon_reload: yes

# Weekly maintenance: the pnpm store accumulates every version of every package
# across all projects and never GCs on its own — prune it so the boot volume
# doesn't silently fill (git install only; npm install doesn't use the pnpm store).
- name: Deploy pnpm store prune service
  ansible.builtin.template:
    src: pnpm-store-prune.service.j2
    dest: ~/.config/systemd/user/pnpm-store-prune.service
    mode: '0644'
  when: openclaw_install_method == "git"

- name: Deploy pnpm store prune timer
  ansible.builtin.template:
    src: pnpm-store-prune.timer.j2
    dest: ~/.config/systemd/user/pnpm-store-prune.timer
    mode: '0644'
  when: openclaw_install_method == "git"

- name: Enable and start pnpm store prune timer
  ansible.builtin.systemd:
    name: pnpm-store-prune.timer
    state: started
    enabled: yes
    scope: user
    daemon_reload: yes
  when: openclaw_install_method == "git"
