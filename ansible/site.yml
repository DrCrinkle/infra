---
- name: Configure OpenClaw server
  hosts: openclaw
  gather_facts: true

  roles:
    - common
    - firewall
    - role: docker
      when: docker_enabled | default(true)
    - nodejs
    - role: tailscale
      when: tailscale_enabled | default(false)
    - role: openclaw
      tags: ['openclaw']

  post_tasks:
    - name: Get Tailscale status as JSON
      ansible.builtin.command: tailscale status --json
      become: true
      register: tailscale_status_json
      changed_when: false
      failed_when: false
      when: tailscale_enabled | default(false)

    - name: Derive Tailscale DNS name from status
      ansible.builtin.set_fact:
        tailscale_dns_name: "{{ (tailscale_status_json.stdout | from_json).Self.DNSName | default('') }}"
      when:
        - tailscale_enabled | default(false)
        - tailscale_status_json.rc == 0
        - tailscale_status_json.stdout is defined
        - tailscale_status_json.stdout | trim | length > 0

    - name: Show connection info
      ansible.builtin.debug:
        msg: |
          OpenClaw deployed successfully!
          
          Gateway: ws://127.0.0.1:{{ openclaw_gateway_port }} (loopback only)
          {% if tailscale_enabled | default(false) %}
          {% if tailscale_dns_name is defined and tailscale_dns_name | length > 0 %}
          Tailscale: https://{{ tailscale_dns_name }}
          {% else %}
          Tailscale: enabled (DNS name unavailable; run `tailscale status` on the host)
          {% endif %}
          {% else %}
          Tailscale: disabled
          {% endif %}
          
          Security architecture (4-layer defense):
          1. Firewall: SSH + Tailscale only (drop zone default)
          2. Docker isolation: DOCKER-USER chain blocks external access
          3. Gateway: loopback bind + Tailscale serve
          4. Systemd: NoNewPrivileges, PrivateTmp, ProtectSystem
          
          Exec security: {{ openclaw_exec_security }}
