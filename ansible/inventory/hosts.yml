all:
  children:
    oci:
      hosts:
        openclaw:
          # OpenClaw has no public ingress; reach it over Tailscale (stable node IP).
          # If the tailnet is down, use the Bastion port-forward as break-glass.
          ansible_host: 100.104.160.85
          ansible_user: opc
          ansible_python_interpreter: /usr/bin/python3
        # The dedicated NAT instance was decommissioned 2026-05-30. OpenClaw now
        # provides NAT egress for the (currently empty) private subnet. Add a `db`
        # host here when the private-subnet database tier is provisioned.
