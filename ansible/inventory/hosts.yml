all:
  children:
    oci:
      hosts:
        openclaw:
          ansible_host: YOUR_SERVER_IP
          ansible_user: opc
          ansible_python_interpreter: /usr/bin/python3
        nat:
          ansible_host: YOUR_NAT_PRIVATE_IP
          ansible_user: opc
          ansible_python_interpreter: /usr/bin/python3
          ansible_ssh_common_args: '-o ProxyJump=opc@YOUR_BASTION_PRIVATE_IP'
