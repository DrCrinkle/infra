openclaw_version: "latest"
openclaw_install_method: "git"
openclaw_git_dir: "/home/{{ ansible_user }}/openclaw"

openclaw_gateway_port: 18789
openclaw_gateway_bind: "loopback"
openclaw_gateway_auth_mode: "token"

openclaw_exec_security: "allowlist"
openclaw_exec_ask: "on-miss"

openclaw_default_model: "anthropic/claude-sonnet-4-5"

openclaw_state_dir: "/home/{{ ansible_user }}/.openclaw"
openclaw_workspace_dir: "/home/{{ ansible_user }}/workspace"
openclaw_workspaces_dir: "/home/{{ ansible_user }}/workspaces"

firewall_allowed_ports:
  - "22/tcp"

# OpenClaw acts as the NAT router for the private subnet (replaced the dedicated
# NAT micro instance on 2026-05-30). Set false on hosts that aren't the egress router.
openclaw_nat_router: true
private_subnet_cidr: "10.0.1.0/24"

tailscale_enabled: true
tailscale_serve_mode: "serve"
tailscale_hostname: "openclaw"

docker_enabled: true

