---
- name: System update all instances
  hosts: oci
  become: true
  serial: 1

  tasks:
    - name: Update all packages
      ansible.builtin.dnf:
        name: '*'
        state: latest
        update_cache: yes
      register: system_update

    - name: Reboot if packages changed
      ansible.builtin.reboot:
        reboot_timeout: 300
      when: system_update.changed
